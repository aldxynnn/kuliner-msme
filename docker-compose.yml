services:
  postgres:
    image: postgres:16-alpine
    container_name: kuliner-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuliner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuliner_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kuliner_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuliner_user} -d ${POSTGRES_DB:-kuliner_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuliner-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuliner-backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kuliner_user}:${POSTGRES_PASSWORD:-kuliner_pass}@postgres:5432/${POSTGRES_DB:-kuliner_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-kuliner_msme_jwt_secret_dev_key_2025}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuliner-net

  web:
    build:
      context: ./customer-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    container_name: customer-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - kuliner-net

volumes:
  postgres_data:
  backend_uploads:

networks:
  kuliner-net:
    driver: bridge
